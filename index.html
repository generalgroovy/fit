<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muscle Atlas Trainer</title>
  <style>
    :root {
      --bg: #080a0f;
      --panel: rgba(16, 20, 31, 0.82);
      --panel-2: rgba(23, 29, 44, 0.92);
      --line: rgba(255,255,255,.12);
      --line-strong: rgba(255,255,255,.22);
      --text: #f2f6ff;
      --muted: #aab5cc;
      --quiet: #778195;
      --accent: #74f2ce;
      --accent-2: #7aa8ff;
      --danger: #ff7a90;
      --warn: #ffd166;
      --shadow: 0 24px 80px rgba(0,0,0,.45);
      --radius: 22px;
      --radius-sm: 14px;
      --body-idle: rgba(118, 132, 157, .24);
      --body-stroke: rgba(255,255,255,.16);
      --primary: #74f2ce;
      --secondary: #7aa8ff;
      --mobility: #ffd166;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 12%, rgba(116,242,206,.16), transparent 35%),
        radial-gradient(circle at 84% 24%, rgba(122,168,255,.15), transparent 34%),
        linear-gradient(135deg, #080a0f 0%, #101522 52%, #07080c 100%);
      color: var(--text);
      overflow: hidden;
    }

    a { color: inherit; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      height: 100vh;
      width: 100vw;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 16px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 74px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(21,27,41,.86), rgba(12,15,24,.82));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .mark {
      width: 44px; height: 44px; border-radius: 16px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(116,242,206,.25), rgba(122,168,255,.25));
      border: 1px solid var(--line-strong);
      box-shadow: inset 0 0 28px rgba(255,255,255,.08);
      flex: 0 0 auto;
    }
    .mark svg { width: 26px; height: 26px; }
    h1 { margin: 0; font-size: clamp(18px, 2.2vw, 30px); letter-spacing: -.03em; line-height: 1.02; }
    .subtitle { margin-top: 5px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pill, .ghost, .solid, select, .search {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,.055);
      padding: 10px 12px;
      min-height: 40px;
    }
    .solid {
      background: linear-gradient(135deg, rgba(116,242,206,.95), rgba(122,168,255,.92));
      color: #06100e;
      border: 0;
      font-weight: 800;
    }
    .ghost:hover, .pill:hover, select:hover { border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.09); }
    .mode-btn.active { background: rgba(116,242,206,.16); border-color: rgba(116,242,206,.55); color: #dffdf5; }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(560px, 1.35fr) minmax(390px, .95fr);
      gap: 14px;
    }

    .left, .right { min-height: 0; }

    .atlas-card, .panel {
      height: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .atlas-card { display: grid; grid-template-rows: auto 1fr auto; }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      min-height: 64px;
    }
    .toolbar-left, .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search { width: min(290px, 44vw); outline: none; border-radius: 14px; }
    .search:focus { border-color: rgba(116,242,206,.55); box-shadow: 0 0 0 4px rgba(116,242,206,.08); }

    .body-stage {
      position: relative;
      min-height: 0;
      overflow: auto;
      padding: 10px;
    }
    .body-grid {
      min-height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
    }
    .view-card {
      min-height: 520px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .view-card h2 {
      margin: 0;
      padding: 12px 12px 0;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--quiet);
      font-weight: 800;
    }
    .view-card svg { width: 100%; height: 100%; display: block; padding: 2px 5px 8px; }
    .skeleton { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.10); stroke-width: 1.3; }
    .joint { fill: rgba(255,255,255,.10); }
    .muscle-region {
      fill: var(--body-idle);
      stroke: var(--body-stroke);
      stroke-width: 1.1;
      transition: fill .15s ease, opacity .15s ease, filter .15s ease, stroke .15s ease;
      cursor: pointer;
      opacity: .92;
    }
    .muscle-region:hover { fill: rgba(116,242,206,.36); stroke: rgba(116,242,206,.82); filter: drop-shadow(0 0 10px rgba(116,242,206,.25)); }
    .muscle-region.selected { fill: rgba(116,242,206,.76); stroke: rgba(212,255,245,.95); filter: drop-shadow(0 0 14px rgba(116,242,206,.45)); }
    .muscle-region.primary-hit { fill: rgba(116,242,206,.88); stroke: rgba(230,255,249,.95); filter: drop-shadow(0 0 16px rgba(116,242,206,.52)); }
    .muscle-region.secondary-hit { fill: rgba(122,168,255,.72); stroke: rgba(213,226,255,.88); filter: drop-shadow(0 0 13px rgba(122,168,255,.35)); }
    .muscle-region.dimmed { opacity: .22; }
    .atlas-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }
    .filterbar {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }
    select { width: 100%; border-radius: 14px; background: rgba(11,14,22,.88); outline: none; }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }
    .stat {
      padding: 10px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
    }
    .stat b { display: block; font-size: 20px; letter-spacing: -.04em; }
    .stat span { color: var(--muted); font-size: 12px; }

    .content-scroll { min-height: 0; overflow: auto; padding: 12px; }
    .section-title { display: flex; justify-content: space-between; align-items: end; gap: 10px; margin: 2px 0 10px; }
    .section-title h3 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
    .section-title small { color: var(--muted); }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.055);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 9px;
      font-size: 12px;
    }
    .chip.primary { border-color: rgba(116,242,206,.5); background: rgba(116,242,206,.13); }
    .chip.secondary { border-color: rgba(122,168,255,.5); background: rgba(122,168,255,.12); }
    .chip.warn { border-color: rgba(255,209,102,.48); background: rgba(255,209,102,.11); color: #fff7d9; }

    .exercise-list { display: grid; gap: 10px; }
    .exercise {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.026));
      overflow: hidden;
      transition: border-color .14s ease, transform .14s ease, background .14s ease;
    }
    .exercise:hover { border-color: rgba(116,242,206,.36); transform: translateY(-1px); background: rgba(255,255,255,.07); }
    .exercise.open { border-color: rgba(116,242,206,.5); }
    .ex-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px;
      align-items: start;
    }
    .ex-title { font-weight: 850; letter-spacing: -.02em; margin: 0 0 5px; }
    .ex-sub { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .score {
      min-width: 54px; text-align: center;
      border: 1px solid rgba(116,242,206,.35);
      background: rgba(116,242,206,.11);
      border-radius: 14px;
      padding: 8px 7px;
    }
    .score b { display: block; font-size: 18px; }
    .score span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .ex-tags { padding: 0 12px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .ex-body { display: none; border-top: 1px solid var(--line); padding: 12px; background: rgba(0,0,0,.12); }
    .exercise.open .ex-body { display: block; }

    .detail-grid { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: start; }
    .demo {
      min-height: 150px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .demo svg { width: 100%; height: 150px; }
    .move-limb { transform-origin: center; animation: limb 1.65s ease-in-out infinite alternate; }
    .move-body { transform-origin: center; animation: bob 1.65s ease-in-out infinite alternate; }
    .arrow { animation: pulse 1.65s ease-in-out infinite alternate; }
    @keyframes limb { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(8px); } }
    @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }

    .steps { margin: 0; padding-left: 20px; color: #dce5f8; line-height: 1.45; font-size: 13px; }
    .steps li { margin: 6px 0; }
    .links { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .links a {
      text-decoration: none;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 9px;
      color: #dfe9ff;
      background: rgba(255,255,255,.045);
    }
    .links a:hover { border-color: rgba(122,168,255,.55); background: rgba(122,168,255,.11); }

    .routine-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.045);
      padding: 12px;
      margin-bottom: 12px;
    }
    .routine-box h4 { margin: 0 0 8px; }
    .routine-box ol { margin: 0; padding-left: 21px; color: #dce5f8; line-height: 1.45; }
    .routine-box li { margin: 6px 0; }
    .coverage { height: 9px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; margin-top: 7px; }
    .coverage div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .25s ease; }

    .source-box {
      margin-top: 12px;
      border: 1px solid rgba(255,209,102,.2);
      background: rgba(255,209,102,.06);
      border-radius: 18px;
      padding: 12px;
      color: #fff7d9;
      font-size: 12px;
      line-height: 1.45;
    }
    .source-box a { color: #fff2bd; }

    .mobile-note { display: none; }

    @media (max-width: 1120px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; overflow: visible; }
      main { grid-template-columns: 1fr; }
      .atlas-card, .panel { height: auto; min-height: 620px; }
      .body-grid { grid-template-columns: repeat(2, minmax(180px, 1fr)); }
      header { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-start; }
    }
    @media (max-width: 650px) {
      .app { padding: 8px; gap: 8px; }
      .body-grid { grid-template-columns: 1fr; }
      .view-card { min-height: 460px; }
      .filterbar, .stats-row { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-left, .toolbar-right { width: 100%; }
      .search { width: 100%; }
      .mobile-note { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64"><path d="M32 6c8 0 12 5 12 12 0 4-2 7-5 9 9 3 15 12 15 24H10c0-12 6-21 15-24-3-2-5-5-5-9 0-7 4-12 12-12Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h1>Muscle Atlas Trainer</h1>
          <div class="subtitle">Select muscles, compare exercises, and build a routine.</div>
        </div>
      </div>
      <div class="top-actions" role="toolbar" aria-label="Training mode">
        <button class="pill mode-btn active" data-mode="finder">Finder</button>
        <button class="pill mode-btn" data-mode="maxCoverage">Target most muscles</button>
        <button class="pill mode-btn" data-mode="isolate">Isolate single</button>
        <button class="pill mode-btn" data-mode="mobility">Healthy mobility</button>
        <button class="pill mode-btn" data-mode="balanced">Balanced day</button>
      </div>
    </header>

    <main>
      <section class="left atlas-card" aria-label="Human muscle atlas">
        <div class="toolbar">
          <div class="toolbar-left">
            <input id="muscleSearch" class="search" type="search" placeholder="Search muscle or exercise…" aria-label="Search muscle or exercise" />
            <button class="ghost" id="toggleSelectMode">Multi-select: on</button>
            <button class="ghost" id="clearSelection">Clear</button>
            <button class="solid" id="selectAllMajor">Select all major</button>
          </div>
          <div class="toolbar-right">
            <button class="ghost" id="copyRoutine">Copy routine</button>
          </div>
        </div>
        <div class="body-stage">
          <div class="body-grid" id="bodyGrid"></div>
        </div>
        <div class="atlas-foot">
          <span>Click a region in front, back, left side, or right side view. Repeated regions share the same muscle selection.</span>
          <span id="selectedCount">0 selected</span>
        </div>
      </section>

      <aside class="right panel" aria-label="Exercise results and instructions">
        <div class="filterbar">
          <select id="typeFilter" aria-label="Exercise type filter">
            <option value="all">All types</option>
            <option value="strength">Strength</option>
            <option value="mobility">Mobility</option>
            <option value="stretch">Stretch</option>
            <option value="activation">Activation</option>
          </select>
          <select id="equipmentFilter" aria-label="Equipment filter">
            <option value="all">All equipment</option>
            <option value="bodyweight">Bodyweight</option>
            <option value="dumbbell">Dumbbell</option>
            <option value="barbell">Barbell</option>
            <option value="cable_band">Cable / band</option>
            <option value="machine">Machine</option>
          </select>
          <select id="difficultyFilter" aria-label="Difficulty filter">
            <option value="all">All levels</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="stats-row">
          <div class="stat"><b id="statExercises">0</b><span>matching exercises</span></div>
          <div class="stat"><b id="statMuscles">0</b><span>selected muscles</span></div>
          <div class="stat"><b id="statCoverage">0%</b><span>routine coverage</span></div>
        </div>
        <div class="content-scroll" id="results"></div>
      </aside>
    </main>
  </div>

<script>
const MUSCLES = [
  { id:'neck', name:'Neck / cervical stabilizers', region:'upper', view:'side' },
  { id:'upper_traps', name:'Upper trapezius', region:'upper', view:'back' },
  { id:'mid_traps', name:'Middle / lower trapezius', region:'upper', view:'back' },
  { id:'rotator_cuff', name:'Rotator cuff', region:'upper', view:'back' },
  { id:'front_delts', name:'Anterior deltoids', region:'upper', view:'front' },
  { id:'lateral_delts', name:'Lateral deltoids', region:'upper', view:'front' },
  { id:'rear_delts', name:'Posterior deltoids', region:'upper', view:'back' },
  { id:'pecs', name:'Pectorals', region:'upper', view:'front' },
  { id:'serratus', name:'Serratus anterior', region:'core', view:'front' },
  { id:'lats', name:'Latissimus dorsi', region:'upper', view:'back' },
  { id:'biceps', name:'Biceps / brachialis', region:'upper', view:'front' },
  { id:'triceps', name:'Triceps', region:'upper', view:'back' },
  { id:'forearms', name:'Forearms / grip', region:'upper', view:'front' },
  { id:'abs', name:'Rectus abdominis / deep core', region:'core', view:'front' },
  { id:'obliques', name:'Obliques / lateral core', region:'core', view:'front' },
  { id:'erectors', name:'Spinal erectors / lumbar extensors', region:'core', view:'back' },
  { id:'hip_flexors', name:'Hip flexors', region:'lower', view:'front' },
  { id:'glutes', name:'Glutes', region:'lower', view:'back' },
  { id:'abductors', name:'Hip abductors', region:'lower', view:'side' },
  { id:'adductors', name:'Adductors', region:'lower', view:'front' },
  { id:'quads', name:'Quadriceps', region:'lower', view:'front' },
  { id:'hamstrings', name:'Hamstrings', region:'lower', view:'back' },
  { id:'calves', name:'Calves / gastrocnemius-soleus', region:'lower', view:'back' },
  { id:'tibialis', name:'Tibialis anterior / shin', region:'lower', view:'front' }
];

const EXERCISES = [
  { id:'goblet-squat', name:'Goblet Squat', type:'strength', equipment:'dumbbell', difficulty:'beginner', pattern:'squat', primary:['quads','glutes'], secondary:['adductors','abs','erectors','calves'], summary:'Accessible full-body lower-body pattern with clear depth control and strong carryover to daily movement.', steps:['Hold the weight tight against the chest; feet roughly shoulder width.','Brace the trunk and sit between the hips without collapsing the knees inward.','Descend only as deep as you can control while keeping the heels down.','Drive the floor away and finish tall without leaning back.'], cautions:'Use a pain-free depth; elevate heels or reduce load if ankle mobility limits control.' },
  { id:'front-squat', name:'Front Squat', type:'strength', equipment:'barbell', difficulty:'advanced', pattern:'squat', primary:['quads','abs'], secondary:['glutes','adductors','erectors','upper_traps'], summary:'Knee-dominant squat variation that heavily taxes trunk rigidity and quadriceps.', steps:['Rack the bar on the front shoulders; elbows high.','Inhale, brace, and sit down between the knees.','Keep the torso tall and bar path over midfoot.','Stand up by pushing through the whole foot.'], cautions:'Requires wrist, shoulder, and thoracic mobility; use straps or a cross-arm rack if needed.' },
  { id:'reverse-lunge', name:'Reverse Lunge', type:'strength', equipment:'bodyweight', difficulty:'beginner', pattern:'lunge', primary:['quads','glutes'], secondary:['hamstrings','calves','abs','adductors'], summary:'Single-leg strength builder with lower knee shear than many forward-lunge variations.', steps:['Stand tall; step one leg backward.','Lower under control until the front thigh approaches parallel.','Keep the front knee tracking over the toes.','Push through the front foot to return to standing.'], cautions:'Hold support if balance limits quality.' },
  { id:'step-up', name:'Step-Up', type:'strength', equipment:'bodyweight', difficulty:'beginner', pattern:'lunge', primary:['quads','glutes'], secondary:['hamstrings','calves','abs'], summary:'Practical unilateral pattern for hip and knee extension with adjustable height.', steps:['Place one foot fully on a stable box or step.','Lean slightly forward and keep the knee tracking over the toes.','Drive through the elevated foot; avoid pushing off the trailing leg.','Control the descent before switching sides.'], cautions:'Start below knee height; increase height only if pelvis stays level.' },
  { id:'romanian-deadlift', name:'Romanian Deadlift', type:'strength', equipment:'barbell', difficulty:'intermediate', pattern:'hinge', primary:['hamstrings','glutes'], secondary:['erectors','lats','forearms','upper_traps'], summary:'Hip-hinge exercise emphasizing posterior-chain strength and hamstring loading.', steps:['Hold the weight close; soften the knees.','Push the hips back while keeping the spine neutral.','Stop when hamstrings limit range or the torso is near parallel.','Drive hips forward and finish tall.'], cautions:'The motion is a hinge, not a squat; keep load close to the body.' },
  { id:'deadlift', name:'Deadlift', type:'strength', equipment:'barbell', difficulty:'advanced', pattern:'hinge', primary:['glutes','hamstrings','erectors'], secondary:['quads','lats','forearms','upper_traps','abs'], summary:'High-coverage hip-hinge lift that trains posterior chain, trunk bracing, grip, and leg drive.', steps:['Set the bar over midfoot and brace hard.','Hinge down, grip the bar, and pull slack out before lifting.','Push the floor away while keeping the bar close.','Lock out with hips and knees extended; lower under control.'], cautions:'Avoid maximal loading until hinge technique is consistent.' },
  { id:'hip-thrust', name:'Hip Thrust / Glute Bridge', type:'strength', equipment:'bodyweight', difficulty:'beginner', pattern:'bridge', primary:['glutes'], secondary:['hamstrings','abs'], summary:'Glute-dominant hip extension with low technical complexity.', steps:['Set upper back on bench for hip thrust or floor for bridge.','Tuck ribs down and brace lightly.','Drive hips upward by squeezing glutes, not over-arching the low back.','Pause at top; lower under control.'], cautions:'Stop if lumbar extension substitutes for hip extension.' },
  { id:'calf-raise', name:'Standing Calf Raise', type:'strength', equipment:'bodyweight', difficulty:'beginner', pattern:'ankle', primary:['calves'], secondary:['forearms'], summary:'Direct plantar-flexion strength for gastrocnemius and soleus.', steps:['Stand tall on floor or a step with support.','Rise onto the balls of the feet.','Pause briefly at the top.','Lower slowly through a comfortable range.'], cautions:'Use support for balance; progress to single-leg only after controlled bilateral reps.' },
  { id:'tibialis-raise', name:'Tibialis Raise', type:'strength', equipment:'bodyweight', difficulty:'beginner', pattern:'ankle', primary:['tibialis'], secondary:['quads'], summary:'Direct anterior-shin work that balances calf-heavy programs.', steps:['Lean back against a wall with heels on the floor.','Lift toes toward the shins without bending the knees excessively.','Pause at the top and lower slowly.','Keep the movement controlled rather than bouncing.'], cautions:'Start with short sets because anterior shin muscles fatigue quickly.' },

const muscleById = Object.fromEntries(MUSCLES.map(m => [m.id, m]));

const qa = (sel, root=document) => [...root.querySelectorAll(sel)];

function attrsToString(attrs){ return Object.entries(attrs).map(([k,v]) => `${k}="${v}"`).join(' '); }
function regionShape(tag, attrs, muscle){
  const label = muscleById[muscle]?.name || muscle;
  return `<${tag} ${attrsToString(attrs)} class="muscle-region" data-muscle="${muscle}" role="button" tabindex="0" aria-label="${escapeHtml(label)}"><title>${escapeHtml(label)}</title></${tag}>`;
}
function renderBody(){
  const bodyGrid = q('#bodyGrid');
  const views = [
    ['front','Front'], ['back','Back'], ['left','Left side'], ['right','Right side']
  ];
  bodyGrid.innerHTML = views.map(([key,label]) => `
    <div class="view-card">
      <h2>${label}</h2>
      <svg viewBox="0 0 200 490" aria-label="${label} body view">
        <path class="skeleton" d="M77 64 Q100 82 123 64 L137 113 Q154 125 158 183 L157 254 Q151 264 139 255 L134 187 Q129 231 126 277 L137 462 L108 462 L100 348 L92 462 L63 462 L74 277 Q71 231 66 187 L61 255 Q49 264 43 254 L42 183 Q46 125 63 113 Z"/>
        <circle class="joint" cx="100" cy="38" r="22"/>
        ${key === 'right' ? `<g transform="translate(200 0) scale(-1 1)">${BODY_REGIONS.left.map(r => regionShape(...r)).join('')}</g>` : BODY_REGIONS[key].map(r => regionShape(...r)).join('')}
      </svg>
    </div>`).join('');
  qa('.muscle-region').forEach(el => {
    el.addEventListener('click', () => toggleMuscle(el.dataset.muscle));
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMuscle(el.dataset.muscle); }});
    el.addEventListener('mouseenter', () => showMusclePreview(el.dataset.muscle));
    el.addEventListener('mouseleave', () => updateBodyClasses());
  });
}

function toggleMuscle(id){
  if(!multiSelect) selected.clear();
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  previewExercise = null;
  openedExercise = null;
  updateAll();
}

function showMusclePreview(id){
  qa('.muscle-region').forEach(el => {
    el.classList.toggle('secondary-hit', el.dataset.muscle === id && !selected.has(id));
  });
}

function updateBodyClasses(){
  const primary = previewExercise ? new Set(previewExercise.primary) : new Set();
  const secondary = previewExercise ? new Set(previewExercise.secondary) : new Set();
  qa('.muscle-region').forEach(el => {
    const id = el.dataset.muscle;
    el.classList.toggle('selected', selected.has(id) && !previewExercise);
    el.classList.toggle('primary-hit', primary.has(id));
    el.classList.toggle('secondary-hit', !primary.has(id) && secondary.has(id));
    el.classList.toggle('dimmed', Boolean(previewExercise) && !primary.has(id) && !secondary.has(id));
  });
  q('#selectedCount').textContent = `${selected.size} selected`;
}

function filters(){
  return {
    type: q('#typeFilter').value,
    equipment: q('#equipmentFilter').value,
    difficulty: q('#difficultyFilter').value,
    search: q('#muscleSearch').value.trim().toLowerCase()
  };
}
function exerciseMatchesFilters(ex, f){
  if(f.type !== 'all' && ex.type !== f.type) return false;
  if(f.equipment !== 'all' && ex.equipment !== f.equipment) return false;
  if(f.difficulty !== 'all' && ex.difficulty !== f.difficulty) return false;
  if(f.search){
    const hay = [ex.name, ex.summary, ex.type, ex.equipment, ex.difficulty, ...ex.primary.map(id => muscleById[id]?.name), ...ex.secondary.map(id => muscleById[id]?.name)].join(' ').toLowerCase();
    const muscleHay = MUSCLES.map(m => `${m.id} ${m.name}`).join(' ').toLowerCase();
    if(!hay.includes(f.search) && !muscleHay.includes(f.search)) return false;
  }
  return true;
}
function exerciseScore(ex, target = selected){
  if(target.size === 0) return ex.primary.length * 2 + ex.secondary.length;
  let score = 0;
  ex.primary.forEach(m => { if(target.has(m)) score += 3; });
  ex.secondary.forEach(m => { if(target.has(m)) score += 1; });
  return score;
}
function allTouched(ex){ return [...new Set([...ex.primary, ...ex.secondary])]; }
function selectedTarget(){ return selected.size ? selected : new Set(MUSCLES.map(m=>m.id)); }

function applyMode(list){
  const target = selectedTarget();
  if(activeMode === 'finder'){
    return list.filter(ex => selected.size === 0 || exerciseScore(ex) > 0)
      .sort((a,b) => exerciseScore(b) - exerciseScore(a) || b.primary.length - a.primary.length || a.name.localeCompare(b.name));
  }
  if(activeMode === 'maxCoverage'){
    return list.filter(ex => ex.type === 'strength' || ex.type === 'activation')
      .filter(ex => selected.size === 0 || exerciseScore(ex, target) > 0)
      .sort((a,b) => coverageCount(b, target) - coverageCount(a, target) || exerciseScore(b,target) - exerciseScore(a,target));
  }
  if(activeMode === 'isolate'){
    return list.filter(ex => ex.type === 'strength' || ex.type === 'activation')
      .filter(ex => ex.primary.length === 1)
      .filter(ex => selected.size === 0 || selected.has(ex.primary[0]))
      .sort((a,b) => exerciseScore(b,target) - exerciseScore(a,target) || a.name.localeCompare(b.name));
  }
  if(activeMode === 'mobility'){
    return list.filter(ex => ex.type === 'mobility' || ex.type === 'stretch' || ex.type === 'activation')
      .filter(ex => selected.size === 0 || exerciseScore(ex,target) > 0)
      .sort((a,b) => coverageCount(b,target) - coverageCount(a,target) || a.name.localeCompare(b.name));
  }
  if(activeMode === 'balanced'){
    const ids = new Set(buildBalancedRoutine(list).map(ex => ex.id));
    return list.filter(ex => ids.has(ex.id)).concat(list.filter(ex => !ids.has(ex.id))).slice(0, 18);
  }
  return list;
}
function coverageCount(ex, target){ return allTouched(ex).filter(m => target.has(m)).length; }

function buildCoverageRoutine(list){
  const target = selectedTarget();
  const allowed = list.filter(ex => (ex.type === 'strength' || ex.type === 'activation') && coverageCount(ex,target) > 0);
  const routine = [];
  const covered = new Set();
  for(let i=0;i<7;i++){
    let best = null, bestGain = -1, bestScore = -1;
    allowed.forEach(ex => {
      if(routine.includes(ex)) return;
      const gain = allTouched(ex).filter(m => target.has(m) && !covered.has(m)).length;
      const sc = exerciseScore(ex,target);
      if(gain > bestGain || (gain === bestGain && sc > bestScore)) { best = ex; bestGain = gain; bestScore = sc; }
    });
    if(!best || bestGain <= 0) break;
    routine.push(best); allTouched(best).forEach(m => { if(target.has(m)) covered.add(m); });
  }
  return routine;
}

function buildMobilityRoutine(list){
  const target = selectedTarget();
  const mobility = list.filter(ex => (ex.type === 'mobility' || ex.type === 'stretch' || ex.type === 'activation') && coverageCount(ex,target) > 0);
  const routine = [];
  const covered = new Set();
  for(let i=0;i<8;i++){
    let best = null, gainBest = -1;
    mobility.forEach(ex => {
      if(routine.includes(ex)) return;
      const gain = allTouched(ex).filter(m => target.has(m) && !covered.has(m)).length;
      if(gain > gainBest) { best = ex; gainBest = gain; }
    });
    if(!best) break;
    routine.push(best); allTouched(best).forEach(m => { if(target.has(m)) covered.add(m); });
    if(selected.size && covered.size >= target.size) break;
  }
  return routine.slice(0, 7);
}

function buildBalancedRoutine(list){
  const f = ex => list.find(e => e.id === ex);
  const targetList = selected.size ? list.filter(ex => exerciseScore(ex, selected) > 0) : list;
  const pick = (...ids) => ids.map(f).find(Boolean);
  const routine = [];
  const add = ex => { if(ex && !routine.includes(ex)) routine.push(ex); };
  if(selected.size){
    buildCoverageRoutine(targetList).slice(0, 5).forEach(add);
    add(targetList.find(ex => ex.type === 'mobility' && exerciseScore(ex,selected)>0));
    return routine.slice(0,7);
  }
  ['goblet-squat','romanian-deadlift','push-up','one-arm-row','overhead-press','side-plank','worlds-greatest-stretch'].forEach(id => add(pick(id)));
  return routine.filter(Boolean);
}

function currentList(){
  const f = filters();
  return applyMode(EXERCISES.filter(ex => exerciseMatchesFilters(ex, f)));
}

function generateRoutine(list){
  if(activeMode === 'mobility') return buildMobilityRoutine(list);
  if(activeMode === 'balanced') return buildBalancedRoutine(EXERCISES.filter(ex => exerciseMatchesFilters(ex, {...filters(), type:'all'})));
  if(activeMode === 'isolate') return list.slice(0, Math.min(6, list.length));
  return buildCoverageRoutine(EXERCISES.filter(ex => exerciseMatchesFilters(ex, {...filters(), type:'all'})));
}

function coveragePercent(routine){
  const target = selectedTarget();
  const covered = new Set();
  routine.forEach(ex => allTouched(ex).forEach(m => { if(target.has(m)) covered.add(m); }));
  return target.size ? Math.round((covered.size / target.size) * 100) : 0;
}

function renderSelectedChips(){
  if(selected.size === 0) return '<div class="chips"><span class="chip warn">No muscle selected: showing general full-body options</span></div>';
  return `<div class="chips">${[...selected].map(id => `<button class="chip primary" data-remove="${id}" title="Remove ${escapeHtml(muscleById[id].name)}">${escapeHtml(muscleById[id].name)} ×</button>`).join('')}</div>`;
}

function renderRoutine(routine){
  if(!routine.length) return '';
  const pct = coveragePercent(routine);
  const label = activeMode === 'mobility' ? 'Healthy mobility sequence' : activeMode === 'isolate' ? 'Isolation shortlist' : activeMode === 'balanced' ? 'Balanced training day' : 'Coverage-optimized routine';
  const dose = activeMode === 'mobility' ? 'Use 30–45 seconds or 5–8 slow reps per side. Keep everything pain-free.' : 'Use 2–4 controlled sets. Stop 1–3 reps before form failure unless you know your recovery and technique are solid.';
  return `<div class="routine-box">
    <h4>${label}</h4>
    <ol>${routine.map(ex => `<li><b>${escapeHtml(ex.name)}</b> <span style="color:var(--muted)">— ${escapeHtml(setText(ex))}</span></li>`).join('')}</ol>
    <div class="coverage" title="Target coverage"><div style="width:${pct}%"></div></div>
    <p style="margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.45">${dose}</p>
  </div>`;
}

function setText(ex){
  if(ex.type === 'mobility') return '5–8 slow reps / side';
  if(ex.type === 'stretch') return '20–45 sec / side';
  if(ex.type === 'activation') return '1–3 × 6–12 controlled reps';
  if(ex.pattern === 'carry') return '3–5 walks of 20–40 m';
  if(ex.pattern === 'core') return '2–4 holds or sets of 20–45 sec';
  return '2–4 × 6–12 reps';
}

function renderExercises(list){
  if(!list.length) return '<div class="routine-box"><h4>No matches</h4><p style="color:var(--muted);line-height:1.45">Relax filters or clear selected muscles. The data is local, so nothing is being fetched from a server.</p></div>';
  return `<div class="exercise-list">${list.map(ex => renderExercise(ex)).join('')}</div>`;
}

function renderExercise(ex){
  const open = openedExercise === ex.id;
  const score = exerciseScore(ex);
  const primary = ex.primary.map(id => muscleById[id]?.name || id);
  const secondary = ex.secondary.map(id => muscleById[id]?.name || id);
  const all = [...primary, ...secondary].slice(0, 8).join(', ');
  return `<article class="exercise ${open ? 'open' : ''}" data-exercise="${ex.id}">
    <div class="ex-head" role="button" tabindex="0" aria-label="Open ${escapeHtml(ex.name)}">
      <div>
        <div class="ex-title">${escapeHtml(ex.name)}</div>
        <div class="ex-sub">${escapeHtml(ex.summary)}<br><b>Targets:</b> ${escapeHtml(all)}</div>
      </div>
      <div class="score"><b>${score}</b><span>match</span></div>
    </div>
    <div class="ex-tags">
      <span class="chip">${escapeHtml(ex.type)}</span><span class="chip">${escapeHtml(ex.equipment)}</span><span class="chip">${escapeHtml(ex.difficulty)}</span><span class="chip">${escapeHtml(setText(ex))}</span>
    </div>
    <div class="ex-body">
      <div class="detail-grid">
        <div class="demo">${demoSvg(ex)}</div>
        <div>
          <div class="chips">
            ${ex.primary.map(id => `<span class="chip primary">${escapeHtml(muscleById[id].name)}</span>`).join('')}
            ${ex.secondary.map(id => `<span class="chip secondary">${escapeHtml(muscleById[id].name)}</span>`).join('')}
          </div>
          <ol class="steps">${ex.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
          <p style="color:var(--muted);font-size:12px;line-height:1.45;margin:10px 0 0"><b>Caution:</b> ${escapeHtml(ex.cautions)}</p>
          <div class="links">${researchLinks(ex).map(l => `<a target="_blank" rel="noopener noreferrer" href="${l.url}">${escapeHtml(l.label)}</a>`).join('')}</div>
        </div>
      </div>
    </div>
  </article>`;
}

function researchLinks(ex){
  const muscles = ex.primary.map(id => muscleById[id].name.split('/')[0].trim()).join(' ');
  const qBase = encodeURIComponent(`${ex.name} ${muscles} exercise training`);
  const qStudy = encodeURIComponent(`${ex.name} ${muscles} electromyography resistance training`);
  const technique = encodeURIComponent(ex.name);
  const links = [
    { label:'PubMed studies', url:`https://pubmed.ncbi.nlm.nih.gov/?term=${qStudy}` },
    { label:'Google Scholar', url:`https://scholar.google.com/scholar?q=${qBase}` },
    { label:'ExRx directory', url:'https://exrx.net/Lists/Directory' },
    { label:'ACE exercise library search', url:`https://www.acefitness.org/resources/everyone/exercise-library/?search=${technique}` }
  ];
  if(ex.type === 'mobility' || ex.type === 'stretch') links.push({ label:'NHS mobility guidance', url:'https://www.nhs.uk/live-well/exercise/flexibility-exercises/' });
  return links;
}

function demoSvg(ex){
  const p = ex.pattern;
  const label = escapeHtml(ex.pattern.replace('_',' '));
  const torsoY = p === 'squat' || p === 'lunge' ? 60 : 46;
  const armPose = p.includes('pull') ? 'M78 66 L52 45 M122 66 L148 45' : p.includes('press') ? 'M78 66 L62 31 M122 66 L138 31' : p === 'carry' ? 'M78 66 L59 116 M122 66 L141 116' : 'M78 66 L64 98 M122 66 L136 98';
  const legPose = p === 'squat' ? 'M91 113 L72 157 L90 202 M109 113 L128 157 L110 202' : p === 'lunge' ? 'M95 113 L65 156 L60 207 M105 113 L142 148 L155 198' : p === 'hinge' ? 'M91 113 L86 164 L90 212 M109 113 L115 164 L111 212' : p === 'ankle' ? 'M91 113 L88 170 L75 211 M109 113 L112 170 L126 211' : 'M91 113 L84 162 L76 211 M109 113 L118 162 L128 211';
  const arrow = p === 'mobility' || p === 'balance' ? '<path class="arrow" d="M45 35 Q100 6 155 35" fill="none" stroke="var(--mobility)" stroke-width="5" stroke-linecap="round"/><path d="M151 22 L159 36 L143 38" fill="none" stroke="var(--mobility)" stroke-width="4" stroke-linecap="round"/>' : '<path class="arrow" d="M160 55 v70" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><path d="M149 116 l11 16 11-16" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 200 230" aria-label="Exercise visualization: ${escapeHtml(ex.name)}">
    <rect x="0" y="0" width="200" height="230" fill="rgba(255,255,255,.015)"/>
    ${arrow}
    <g class="move-body" fill="none" stroke="rgba(242,246,255,.86)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="100" cy="30" r="16" fill="none"/>
      <path d="M100 48 L100 ${torsoY+66}"/>
      <path class="move-limb" d="${armPose}"/>
      <path class="move-limb" d="${legPose}"/>
    </g>
    <text x="100" y="222" text-anchor="middle" fill="rgba(242,246,255,.65)" font-size="12" font-weight="800" letter-spacing="1.5">${label.toUpperCase()}</text>
  </svg>`;
}

function renderSources(){
  return `<div class="source-box"><b>Evidence baseline:</b> strength work should cover major muscle groups at least two days per week. Mobility work here is intentionally conservative: warm up first, move slowly, do not bounce, and stop before pain. Sources: ${SOURCE_BASE.map(s => `<a target="_blank" rel="noopener noreferrer" href="${s.url}">${escapeHtml(s.label)}</a>`).join(' · ')}.</div>`;
}

function updateAll(){
  const list = currentList();
  const routine = generateRoutine(list);
  lastRoutine = routine;
  const pct = coveragePercent(routine);
  q('#results').innerHTML = `
    <div class="section-title"><h3>${modeTitle()}</h3><small>${activeModeHint()}</small></div>
    ${renderSelectedChips()}
    ${renderRoutine(routine)}
    ${renderExercises(list)}
    ${renderSources()}
    <p class="mobile-note">Tip: rotate to landscape on small phones for the full four-view atlas.</p>
  `;
  q('#statExercises').textContent = list.length;
  q('#statMuscles').textContent = selected.size;
  q('#statCoverage').textContent = `${pct}%`;
  q('#selectedCount').textContent = `${selected.size} selected`;
  q('#toggleSelectMode').textContent = `Multi-select: ${multiSelect ? 'on' : 'off'}`;
  qa('[data-remove]').forEach(btn => btn.addEventListener('click', e => { selected.delete(e.currentTarget.dataset.remove); previewExercise = null; openedExercise = null; updateAll(); }));
  qa('.exercise').forEach(card => {
    const id = card.dataset.exercise;
    const ex = EXERCISES.find(e => e.id === id);
    const head = q('.ex-head', card);
    head.addEventListener('click', () => { openedExercise = openedExercise === id ? null : id; previewExercise = openedExercise ? ex : null; updateAll(); });
    head.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openedExercise = openedExercise === id ? null : id; previewExercise = openedExercise ? ex : null; updateAll(); }});
    card.addEventListener('mouseenter', () => { previewExercise = ex; updateBodyClasses(); });
    card.addEventListener('mouseleave', () => { previewExercise = openedExercise ? EXERCISES.find(e => e.id === openedExercise) : null; updateBodyClasses(); });
  });
  updateBodyClasses();
}
function modeTitle(){
  return ({ finder:'Exercise finder', maxCoverage:'Compound coverage optimizer', isolate:'Single-muscle isolation', mobility:'Healthy mobility generator', balanced:'Balanced day generator' })[activeMode] || 'Exercise finder';
}
function activeModeHint(){
  return ({ finder:'sorted by selected-muscle match', maxCoverage:'greedy coverage routine', isolate:'one primary target per exercise', mobility:'joint-friendly sequence', balanced:'push / pull / legs / core / mobility' })[activeMode] || '';
}

async function copyRoutineText(){
  const lines = [];
  lines.push('Muscle Atlas Trainer routine');
  lines.push(`Mode: ${modeTitle()}`);
  lines.push(`Selected muscles: ${selected.size ? [...selected].map(id => muscleById[id].name).join(', ') : 'all major muscle groups'}`);
  lines.push('');
  lastRoutine.forEach((ex, i) => lines.push(`${i+1}. ${ex.name} — ${setText(ex)} — primary: ${ex.primary.map(id => muscleById[id].name).join(', ')}`));
  lines.push('');
  lines.push('Caution: Use pain-free range, warm up, and scale load to technique. This app is educational, not medical advice.');
  const text = lines.join('\n');
  try {
    if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    flashCopy('Copied');
  } catch {
    let output = q('#routineCopyText');
    if (!output) {
      output = document.createElement('textarea');
      output.id = 'routineCopyText';
      output.setAttribute('aria-label', 'Routine text: select and copy');
      output.readOnly = true;
      output.rows = 8;
      output.style.width = '100%';
      q('#results').prepend(output);
    }
    output.value = text;
    output.focus();
    output.select();
    flashCopy('Select and copy below');
  }
}
function flashCopy(msg){ const b = q('#copyRoutine'); const old = b.textContent; b.textContent = msg; setTimeout(()=> b.textContent = old, 1100); }
function escapeHtml(str){ return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

q('#toggleSelectMode').addEventListener('click', () => { multiSelect = !multiSelect; updateAll(); });
q('#clearSelection').addEventListener('click', () => { selected.clear(); openedExercise = null; previewExercise = null; updateAll(); });
q('#selectAllMajor').addEventListener('click', () => { selected = new Set(MUSCLES.map(m => m.id)); openedExercise = null; previewExercise = null; updateAll(); });
q('#copyRoutine').addEventListener('click', copyRoutineText);
qa('.mode-btn').forEach(btn => btn.addEventListener('click', e => { activeMode = e.currentTarget.dataset.mode; qa('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === activeMode)); openedExercise = null; previewExercise = null; updateAll(); }));
['#typeFilter','#equipmentFilter','#difficultyFilter','#muscleSearch'].forEach(sel => q(sel).addEventListener('input', () => { openedExercise = null; previewExercise = null; updateAll(); }));

renderBody();
updateAll();
</script>
</body>
</html>
